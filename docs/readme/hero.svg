<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">LinguaLens</title>
  <desc id="description">自带密钥的 Chrome 网页翻译插件。右侧以英文原句和中文译句展示逐段双语阅读。</desc>
  <rect width="1200" height="220" rx="20" fill="#f6f8fc" />

  <!-- Reuse the extension's lens mark; no external images or fonts. -->
  <g id="brand-mark" transform="translate(60 62) scale(2.4)">
    <rect width="40" height="40" rx="12" fill="#2563eb" />
    <path d="M11 10v17h13M25 12a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm6 14 5 6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g id="wordmark" fill="#17233a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
    <text x="186" y="110" font-size="68" font-weight="700" letter-spacing="-2">LinguaLens</text>
    <text x="190" y="156" fill="#52637a" font-size="28">自带密钥的 Chrome 网页翻译插件</text>
  </g>

  <!-- A reading sample reflects the real paragraph-level bilingual layout. -->
  <g id="bilingual-sample" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
    <text x="792" y="96" fill="#52637a" font-size="24">Read across languages.</text>
    <path d="M774 120v39" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <text x="792" y="151" fill="#17233a" font-size="31" font-weight="500">跨语言阅读。</text>
  </g>
</svg>
